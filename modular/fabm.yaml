instances:
  # ==================================
  # this has to appear at the very top
  switches:
    model: nersc/ecosmo_shared
    parameters:
      # carbon chemistry
      couple_co2 : true                      # Enable carbonate chemistry

      # organic matter decomposition
      frr: 0.4                                # Ratio of DOM production when detritus is produced
      use_bact_nutrient_limitation   : .false. # optional implicit bacterial nutrient limitation on remineralization, remineralization slows when virtual bacteria are starved

      # phytoplankton types
      model_has_silicifier           : .true.  # if diatoms are included in the model, set true
      model_has_calcifier            : .true.  # if coccoliths are included in the model, set true

      # CaCO3
      use_virtual_calcite            : .false. 
      # optional virtual calcite where calcite is only formed upon mortality and grazing
      # IMPORTANT: will only activate if model_has_calcifier is true above
      # IMPORTANT: set to false if you have explicit coccolithophores in the model
      # IMPORTANT: if true, set is_calcifier = .true. for flagellates in the parameters below.
                
      # detritus sinking scheme
      # only one of the following two should be true, or both false for constant detritus sinking speed
      depth_dependent_sinking_speed  : .false. # optional increasing organic matter sinking speed as a function of depth
      use_community_sinking          : .false.  # community composition dependent sinking rates

      # phytoplankton growth modifications
      use_geider_PI_curve            : .false.  # optional use of Geider's PI curve for P photoproduction, if false, use Yumruktepe et al., 2023 ECOSMO II(CHL) formulation
      use_temp_dependency_phy        : .false.  # optional temperature dependency for P production, if false, Tdep = 1.0_rk, see phy.F90
                                                        
      # oxygen exchange
      use_niva_ersem_oxygen_exchange : .false. # optional oxygen exchange following NIVA ERSEM implementation in oxygen.F90

      # zooplankton behaviour
      use_prey_switching             : .false. # optional adaptive prey switching (Murdoch 1969), zoo are allowed to change preferences when some preferred prey are absent
      use_slp_egest_paradigm         : .false. # optional explicit sloppy feeding and waste routing (Steinberg & Landry 2017)

  # this has to appear at the very top
  # ==================================

  # ==================================
  # LIGHT model. This is a fork of gotm/light, but can handle ice algae defined in nersc/ice_algae
  light:
    model: nersc/light
    parameters:
       g2         : 23.0     # e-folding depth of visible fraction  (m)                     default=23.0 for Type-I
       g1         : 0.35
       A          : 0.58     # non-visible fraction (non-PAR)
  # ==================================

  # ERSEM carbonate chemistry
  # ==================================
  co2:
    model: ersem/carbonate
    initialization:
      TA: 2300.0
      c: 2200.0
  # ==================================


  # ECOSMO MODULAR MODEL
  # ==================================
  no3:
    long_name: nitrate
    model: nersc/ecosmo_nutrient
    initialization:
      c: 1200.0     # nitrate (mgC/m**3)
  pho:
    long_name: phosphate
    model: nersc/ecosmo_nutrient
    initialization:
      c: 1200.0     # phosphate (mgC/m**3)

  sil:
    long_name: silicate
    model: nersc/ecosmo_nutrient
    initialization:
      c: 1000.0     # silicate (mgC/m**3)

  nh4:
    long_name: ammonium
    model: nersc/ecosmo_nutrient
    initialization:
      c: 8.0     # ammonium (mgC/m**3)

  oxy:
    long_name: oxygen
    model: nersc/ecosmo_oxygen
    initialization:
      c: 300 # oxygen mmol/m3
    coupling:
      no3: no3/c
      nh4: nh4/c
      alk: co2/TA

  det:
    long_name: detritus
    model: nersc/ecosmo_organic_matter
    initialization:
      c: 0.1     # detritus (mgC/m**3)
    parameters:
      remin: 0.00315 # Detritus remineralization rate  (1/d)
      # below is only activated if community sinking is turned on at top of this file (use_community_sinking = true)
      #min_dsnk: 0.468  # this is the sinkind speed applied to flagellate detritus
      #max_dsnk: 7.96   # this is the sinkind speed applied to mesozooplankton detritus
      # if (use_community_sinking = true), OMsink will be ignored
      OMsink: 5.0 # Detritus sinking rate  (m/d)
    coupling:
      no3: no3/c
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      dic: co2/c
      alk: co2/TA

  dom:
    long_name: dissolved organic matter
    model: nersc/ecosmo_organic_matter
    initialization:
      c: 3.0     # dom (mgC/m**3)
    parameters:
      remin: 0.0315 # DOM remineralization rate  (1/d) (10 times that of detritus)
      is_dissolved: true # DOM is dissolved, does not sink even if community sinking is active
      OMsink: 0.0 # DOM does not sink 
    coupling:
      no3: no3/c
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      dic: co2/c
      alk: co2/TA

  opal:
    long_name: opal
    model: nersc/ecosmo_opal
    initialization:
      c: 0.1 # opal (mgC/m**3)
    parameters:
      regenSi: 0.015    # Si regeneration rate (1/d)
      OMsink: 5.0 # Opal sinking rate  (m/d)
    coupling:
      sil: sil/c

  fla:
    long_name: flagellates
    model: nersc/ecosmo_phy
    parameters:
      mu: 0.43 #0.29           # max growth rate [1/d]. If temp-dependency is activated, this is the value at T=0C, else, constant. Default: 0.43 when Tdep is false.
#      q10: 2.0 #1.67          # Q10 for this phytoplankton. Ignored if temp-dependency is 'false'
      m: 0.0411
      m2: 0.285
      Km2: 285.18
      rNH4: 0.20
      rNO3: 0.50
      rPO4: 0.05
      Psink: 0.0
      MINchl2cP: 0.00333     # minimum Chl to C ratio (mg Chl/mg C) i.e 300.0 C/Chl
      MAXchl2cP: 0.04261     # maximum Chl to C ratio (mg Chl/mg C) i.e 23.47 C/Chl
      alfaP: 2.936           # initial slope of the P-I curve (mgC m2/(mgChl day W)**-1) 
      psi: 3.00
      light_att_chl: 0.0339  # Optical attenuation due to chlorophyll
      #sinkD: 0.468           # Flagellate detritus sinking speed (m/d) if use_community_sinking = true
    coupling:
      no3: no3/c
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      det: det/c
      dom: dom/c
      alk: co2/TA
      dic: co2/c
    initialization:
      c: 0.1 # mgC/m3 
      chl: 0.005 # mgChl/m3 

  dia:
    long_name: diatoms
    model: nersc/ecosmo_phy
    parameters:
      mu: 0.62 #0.8           # max growth rate [1/d]. If temp-dependency is activated, this is the value at T=0C, else, constant. Default: 0.62 when Tdep is false.
#      q10: 2.0 #1.55          # Q10 for this phytoplankton. Ignored if temp-dependency is 'false'
      m: 0.0411
      m2: 0.285
      Km2: 285.18
      rNH4: 0.20
      rNO3: 0.50
      rPO4: 0.05
      rSi: 0.5
      Psink: 0.0
      MINchl2cP: 0.00333     # minimum Chl to C ratio (mg Chl/mg C) i.e 300.0 C/Chl
      MAXchl2cP: 0.03708     # maximum Chl to C ratio (mg Chl/mg C) i.e 26.97 C/Chl
      alfaP: 4.734           # initial slope of the P-I curve (mgC m2/(mgChl day W)**-1) 
      psi: 3.00
      SiUptLim: 80.0         # Below this value (mgC/m3 silicate), Si uptake is stopped.
      light_att_chl: 0.0339  # Optical attenuation due to chlorophyll
      #sinkD: 5.59            # Diatom detritus sinking speed (m/d) if use_community_sinking = true
      is_diatom: true
    coupling:
      no3: no3/c
      nh4: nh4/c
      pho: pho/c
      sil: sil/c
      oxy: oxy/c
      det: det/c
      dom: dom/c
      alk: co2/TA
      dic: co2/c
      opal: opal/c
    initialization:
      c: 0.1 # mgC/m3 
      chl: 0.005 # mgChl/m3

  ccl:
    long_name: coccolithophores
    model: nersc/ecosmo_phy
    parameters:
      mu: 0.4 #0.74           # max growth rate [1/d]. If temp-dependency is activated, this is the value at T=0C, else, constant. Default: 0.4 when Tdep is false.
#      q10: 2.0 #1.42          # Q10 for this phytoplankton. Ignored if temp-dependency is not activated
      m: 0.0411
      m2: 0.285
      Km2: 285.18
      rNH4: 0.20
      rNO3: 1.00
      rPO4: 0.0015
      Psink: 1.5
      MINchl2cP: 0.00333     # minimum Chl to C ratio (mg Chl/mg C) i.e 300.0 C/Chl
      MAXchl2cP: 0.03871     # maximum Chl to C ratio (mg Chl/mg C) i.e 25.83 C/Chl
      alfaP: 2.061           # initial slope of the P-I curve (mgC m2/(mgChl day W)**-1) 
      psi: 3.00
      light_att_chl: 0.0339  # Optical attenuation due to chlorophyll
      #sinkD: 5.73            # Coccolithophore detritus sinking speed (m/d) if use_community_sinking = true
      is_calcifier: true
    coupling:
      no3: no3/c
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      det: det/c
      dom: dom/c
      alk: co2/TA
      dic: co2/c
      caco3: caco3/c
      Om_cal_target: co2_Om_cal
    initialization:
      c: 0.1 # mgC/m3 
      chl: 0.005 # mgChl/m3 

  microzoo:
    long_name: microzooplankton
    model: nersc/ecosmo_zooplankton
    parameters:
      nprey: 5     # Number of preys for this grazer
      grz1: 1.05
      grz2: 1.05
      grz3: 1.01
      grz4: 1.05
      grz5: 0.0
      Rg: 0.552     # Zs, Zl half saturation  (mmolN/m**3)
      m: 0.0388      # Zooplankton mortality rate  (1/d)
      m2: 0.085
      Km2: 285.18
      exc: 0.078    # Zooplankton excretion rate  (1/d)
      #sinkD: 0.987  # Microzooplankton detritus sinking speed (m/d) if use_community_sinking = true
      gamma1: 0.75
      gamma2: 0.75
      gamma3: 0.75
      gamma4: 0.3
      gamma5: 0.75
      pref1: 0.65
      pref2: 0.2
      pref3: 0.1
      pref4: 0.06
      pref5: 0.0
      prey2_is_diatom: true
      prey3_is_calcifier: true
      prey4_is_detritus: true
      prey5_is_zoo: true
    coupling:
      prey1c: fla/c
      prey2c: dia/c
      prey3c: ccl/c
      prey1chl: fla/chl
      prey2chl: dia/chl
      prey3chl: ccl/chl
      prey4c: det/c
      prey5c: microzoo/c # cannibalism (default: false; i.e. pref5 = 0.0)
      #prey1sinkD_diag: fla/sinkD_diag
      #prey2sinkD_diag: dia/sinkD_diag
      #prey3sinkD_diag: ccl/sinkD_diag
      #prey4sinkD_diag: det/sinkD_diag
      #prey5sinkD_diag: microzoo/sinkD_diag
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      det: det/c
      dom: dom/c
      dic: co2/c
      alk: co2/TA
      opal: opal/c
      caco3: caco3/c
      pcal: ccl/pcal
    initialization:
      c: 0.01 # mgC/m3

  mesozoo:
    long_name: mesozooplankton
    model: nersc/ecosmo_zooplankton
    parameters:
      nprey: 6     # Number of preys for this grazer
      grz1: 0.92
      grz2: 0.92
      grz3: 0.99
      grz4: 0.92
      grz5: 0.559
      grz6: 0.0
      Rg: 0.427     # Zs, Zl half saturation  (mmolN/m**3)
      m: 0.0388      # Zooplankton mortality rate  (1/d)
      m2: 0.085
      Km2: 285.18
      exc: 0.078    # Zooplankton excretion rate  (1/d)
      #sinkD: 7.96   # Mesozooplankton detritus sinking speed (m/d) if use_community_sinking = true
      gamma1: 0.75
      gamma2: 0.75
      gamma3: 0.75
      gamma4: 0.3
      gamma5: 0.75
      gamma6: 0.75
      pref1: 0.07
      pref2: 0.54
      pref3: 0.19
      pref4: 0.07
      pref5: 0.11
      pref6: 0.0
      prey2_is_diatom: true
      prey3_is_calcifier: true
      prey4_is_detritus: true
      prey5_is_zoo: true
      prey6_is_zoo: true
    coupling:
      prey1c: fla/c
      prey2c: dia/c
      prey3c: ccl/c
      prey1chl: fla/chl
      prey2chl: dia/chl
      prey3chl: ccl/chl
      prey4c: det/c
      prey5c: microzoo/c
      prey6c: mesozoo/c # cannibalism (default: false; i.e. pref6 = 0.0)
      #prey1sinkD_diag: fla/sinkD_diag
      #prey2sinkD_diag: dia/sinkD_diag
      #prey3sinkD_diag: ccl/sinkD_diag
      #prey4sinkD_diag: det/sinkD_diag
      #prey5sinkD_diag: microzoo/sinkD_diag
      #prey6sinkD_diag: mesozoo/sinkD_diag
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      det: det/c
      dom: dom/c
      dic: co2/c
      alk: co2/TA
      opal: opal/c
      caco3: caco3/c
      pcal: ccl/pcal
    initialization:
      c: 0.01 # mgC/m3

  caco3:
    long_name: calcium_carbonate
    model: nersc/ecosmo_caco3
    parameters:
      IMsink: 5.0
      dissCmax: 0.03
    coupling:
      dic: co2/c
      alk: co2/TA
      Om_cal_target: co2_Om_cal
    initialization:
      c: 0.05

  sed:
    long_name: sediment
    model: nersc/ecosmo_sediment
    parameters:
      resuspRt: 25.00
      sedimRt: 5.0
      burialRt: 0.00005
      reminSED: 0.001
      TctrlDenit: 0.15
      RelSEDp1: 0.15
      RelSEDp2: 0.1
      reminSEDsi: 0.0002
    coupling:
      no3: no3/c
      nh4: nh4/c
      pho: pho/c
      oxy: oxy/c
      det: det/c
      sil: sil/c
      opal: opal/c
      dic: co2/c
      alk: co2/TA
      caco3: caco3/c
      #dsnk: det/dsnk # this line should be commented out if community sinkind is false
    initialization:
      sed1       : 113.6 # mgC/m2 (20mgN in C units)
      sed2       : 56.65 # mgC/m2 (20mgSi in C units)
      sed3       : 82.2  # mgC/m2 (2mgP in C units)
      sed4       : 0.05  # mgC/m2 (CAGLAR : no idea what the value should be)
